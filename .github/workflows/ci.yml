name: ForgeFPS CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore ForgeFPS.sln

      - name: Build (Release)
        run: dotnet build ForgeFPS.sln -c Release --no-restore

      - name: Run tests
        run: 'dotnet test ForgeFPS.sln -c Release --no-build --logger "trx;LogFileName=test_results.trx"'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/*.trx'

      - name: Check test results
        if: always()
        run: |
          $results = Get-ChildItem -Path . -Recurse -Filter "*.trx"
          foreach ($r in $results) {
            [xml]$xml = Get-Content $r.FullName
            $failed = $xml.TestRun.ResultSummary.Failed
            if ($failed -gt 0) {
              Write-Error "$($r.FullName): $failed test(s) failed"
              exit 1
            }
          }