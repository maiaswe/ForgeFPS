name: ForgeFPS CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore ForgeFPS.sln

      - name: Build non-WinUI projects (Release)
        run: |
          dotnet build src/ForgeFPS.Domain/ForgeFPS.Domain.csproj -c Release --no-restore
          dotnet build src/ForgeFPS.Contracts/ForgeFPS.Contracts.csproj -c Release --no-restore
          dotnet build src/ForgeFPS.Shared/ForgeFPS.Shared.csproj -c Release --no-restore
          dotnet build src/ForgeFPS.Application/ForgeFPS.Application.csproj -c Release --no-restore
          dotnet build src/ForgeFPS.Infrastructure.Windows/ForgeFPS.Infrastructure.Windows.csproj -c Release --no-restore
          dotnet build src/ForgeFPS.Games.Abstractions/ForgeFPS.Games.Abstractions.csproj -c Release --no-restore
          dotnet build src/ForgeFPS.Games.CS2/ForgeFPS.Games.CS2.csproj -c Release --no-restore
          dotnet build src/ForgeFPS.Benchmarking/ForgeFPS.Benchmarking.csproj -c Release --no-restore

      - name: Run tests
        run: |
          dotnet test tests/ForgeFPS.Domain.Tests/ForgeFPS.Domain.Tests.csproj -c Release --no-build
          dotnet test tests/ForgeFPS.Application.Tests/ForgeFPS.Application.Tests.csproj -c Release --no-build
          dotnet test tests/ForgeFPS.Benchmarking.Tests/ForgeFPS.Benchmarking.Tests.csproj -c Release --no-build
          dotnet test tests/ForgeFPS.Games.CS2.Tests/ForgeFPS.Games.CS2.Tests.csproj -c Release --no-build

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/*.trx'
